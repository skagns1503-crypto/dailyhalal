<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>데일리할랄 단체주문</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=Black+Han+Sans&display=swap">
<script src="https://t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
<style>
/* 화면 모양은 목업 2판(mockup/order_mockup.html, 09-19 확정) 그대로 — 휴대폰 틀·옆 설명판만 뺐다 */
:root{
  --ground:#EBEFEA; --panel:#FFFFFF; --panel2:#F5F7F4; --ink:#1B2623; --muted:#5B6964; --line:#D3DBD5;
  --pine:#0F5C4E; --pine-ink:#FFFFFF; --pine-soft:#DAEAE4;
  --saffron:#9A6508; --saffron-bg:#F6E7C4; --danger:#A8361F; --danger-bg:#F6DDD6;
  --shadow:0 18px 50px rgba(15,40,34,.18);
  --kakao:#FEE500; --kakao-ink:#191600; --naver:#03C75A; --naver-ink:#FFFFFF;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0F1513; --panel:#18211E; --panel2:#1F2A26; --ink:#E4EBE7; --muted:#98A7A1; --line:#2D3A35;
    --pine:#4DB39A; --pine-ink:#08130F; --pine-soft:#1D3A32;
    --saffron:#EBB850; --saffron-bg:#3A2D12; --danger:#EC8A74; --danger-bg:#3E2019;
    --shadow:0 18px 50px rgba(0,0,0,.5); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ground:#0F1513; --panel:#18211E; --panel2:#1F2A26; --ink:#E4EBE7; --muted:#98A7A1; --line:#2D3A35;
  --pine:#4DB39A; --pine-ink:#08130F; --pine-soft:#1D3A32;
  --saffron:#EBB850; --saffron-bg:#3A2D12; --danger:#EC8A74; --danger-bg:#3E2019;
  --shadow:0 18px 50px rgba(0,0,0,.5); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--ground);color:var(--ink);font-family:"IBM Plex Sans KR",system-ui,-apple-system,"Malgun Gothic",sans-serif;font-size:14px;line-height:1.55}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--pine);outline-offset:2px}
.ex{display:inline-block;font-size:10.5px;font-weight:700;line-height:1.4;color:var(--saffron);background:var(--saffron-bg);border-radius:4px;padding:0 5px;margin-left:4px;vertical-align:1px;letter-spacing:.02em}
.lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:6px}

/* app frame */
.phone{position:relative;width:100%;max-width:520px;margin:0 auto;height:100vh;height:100dvh;background:var(--panel2);overflow:hidden;display:flex;flex-direction:column}
@media (min-width:600px){body{padding-block:16px}.phone{height:calc(100vh - 32px);height:calc(100dvh - 32px);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow)}}

/* ── PC 화면 — 폭이 넓으면 넓게 쓴다(휴대폰은 위 규칙 그대로) ── */
@media (min-width:900px){
  body{font-size:15px;padding-block:22px}
  .phone{max-width:680px}
  .appbar{padding:14px 20px 12px}
  .appbar .title{font-size:17px}
  .screen{padding:20px 22px}
  .h{font-size:20px}
}
/* 사장님·직원 화면은 표 성격이라 더 넓게 + 달력과 목록을 두 단으로 */
@media (min-width:1100px){
  .phone.wide{max-width:1180px}
  .phone.wide .screen{display:grid;grid-template-columns:minmax(380px,460px) 1fr;grid-auto-rows:max-content;align-items:start;gap:16px 20px;padding:22px 26px}
  .phone.wide .screen>*{grid-column:2}
  .phone.wide .screen>.cal{grid-column:1;grid-row:1/span 99;position:sticky;top:0}
  .phone.wide .cal .d{min-height:68px}
  .phone.wide .ocard{margin:0}
}
@media (min-width:1500px){ .phone.wide{max-width:1360px} }
.testbar{background:var(--saffron-bg);color:var(--saffron);font-size:11.5px;font-weight:700;text-align:center;padding:4px 10px}
.appbar{display:flex;align-items:center;gap:8px;padding:12px 14px 10px;background:var(--panel);border-bottom:1px solid var(--line);min-height:52px}
.appbar.bare{background:transparent;border-bottom:0;padding-bottom:0;min-height:0}
.appbar .title{flex:1;font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{border:0;background:transparent;padding:4px 8px;border-radius:8px;font-size:18px;line-height:1;color:var(--ink)}
.cbtn{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);background:var(--panel2);border-radius:999px;padding:4px 9px;font-size:11.5px;font-weight:600;color:var(--ink);text-decoration:none;white-space:nowrap}
.cbtn svg{width:14px;height:14px;fill:currentColor;flex:none}
.cbtn.tel{background:var(--pine-soft);border-color:var(--pine);color:var(--pine)}
.cbtn.map{color:var(--naver);border-color:var(--naver)}
a.btn{text-decoration:none}
.tosite{display:inline-block;margin:-4px 0 2px;font-size:13px;font-weight:600;color:var(--pine);text-decoration:none}
.btn.social.google{color:var(--ink)}
.cbtn.ig{background:radial-gradient(circle at 30% 107%,#fdf497 0%,#fdf497 5%,#fd5949 45%,#d6249f 60%,#285AEB 90%);border-color:transparent;color:#fff}
@media (max-width:420px){.cbtn span{display:none}.cbtn{padding:5px 7px}}
.chipbtn{border:1px solid var(--line);background:var(--panel2);border-radius:999px;padding:4px 10px;font-size:12px;font-weight:500;white-space:nowrap}
.screen{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:14px}
.foot{padding:12px 14px calc(16px + env(safe-area-inset-bottom));background:var(--panel);border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.toast{position:absolute;left:14px;right:14px;bottom:90px;background:var(--ink);color:var(--panel);border-radius:12px;padding:11px 14px;font-weight:500;font-size:13px;opacity:0;transform:translateY(8px);transition:opacity .2s,transform .2s;pointer-events:none;z-index:5}
.toast.on{opacity:1;transform:none}
.phone.busy .screen,.phone.busy .foot,.phone.busy .appbar{pointer-events:none;opacity:.6}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
/* 09-27(8) 꼭 읽어야 하는 안내 = 「확인」 누를 때까지 떠 있는 창(아래 토스트는 긴 화면에서 못 보고 지나감 — 사장님 「팝업도 없었다」) */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:24px;z-index:50}
.modal[hidden]{display:none}
.modal .box{background:var(--panel);color:var(--ink);border-radius:16px;padding:20px;width:100%;max-width:360px;display:flex;flex-direction:column;gap:16px;font-size:15px;line-height:1.55;box-shadow:var(--shadow)}
#modal-msg{white-space:pre-line}
.otp{max-width:9.5em;letter-spacing:.35em;font-size:18px;font-weight:700;text-align:center;font-variant-numeric:tabular-nums}

/* 달력 — 사장님 화면 */
.cal{display:flex;flex-direction:column;gap:8px}
.cal .head{display:flex;align-items:center;gap:8px}
.cal .head b{flex:1;font-size:15px}
.cal .nav{border:1px solid var(--line);background:var(--panel2);border-radius:8px;width:30px;height:30px;font-size:15px;line-height:1}
.cal .wk,.cal .grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .wk span{text-align:center;font-size:11px;font-weight:700;color:var(--muted);padding-bottom:2px}
.cal .wk span:first-child{color:var(--danger)}
.cal .d{position:relative;min-height:56px;border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:4px 4px 3px;display:flex;flex-direction:column;gap:2px;text-align:left;font:inherit;color:inherit}
.cal .d.pad{border-color:transparent;background:transparent;pointer-events:none}
.cal .d .n{font-size:11.5px;font-weight:700;color:var(--muted)}
.cal .d.sun .n{color:var(--danger)}
.cal .d.today{border-color:var(--pine);box-shadow:inset 0 0 0 1px var(--pine)}
.cal .d.on{background:var(--pine);border-color:var(--pine)}
.cal .d.on .n,.cal .d.on .q,.cal .d.on .c{color:var(--pine-ink)}
.cal .d.off{background:var(--panel2)}
.cal .d .q{font-size:11px;font-weight:700;color:var(--pine);line-height:1.25}
.cal .d .c{font-size:10px;color:var(--muted);line-height:1.2}
.cal .d .warn{color:var(--saffron)}
.cal .d .dots{display:flex;gap:2px;margin-top:auto;flex-wrap:wrap}
.cal .d .dot2{width:5px;height:5px;border-radius:50%;background:var(--pine)}
.cal .d .dot2.requested{background:var(--saffron)}
.cal .d .dot2.closed{background:var(--line)}
.cal .legend{display:flex;gap:10px;flex-wrap:wrap;font-size:11px;color:var(--muted)}
.cal .legend i{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:3px;vertical-align:1px}

.h{font-size:18px;font-weight:700;margin:0;text-wrap:balance}
.muted{color:var(--muted)}
.small{font-size:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-weight:500;font-size:13px}
.input,select.input,textarea.input{width:100%;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:10px 12px}
textarea.input{min-height:70px;resize:vertical}
.row{display:flex;gap:8px;align-items:center}
.row>.grow{flex:1;min-width:0}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:12px 14px;font-weight:700;width:100%;text-align:center}
.btn.primary{background:var(--pine);border-color:var(--pine);color:var(--pine-ink)}
.btn.warn{background:var(--saffron-bg);border-color:var(--saffron);color:var(--saffron)}
.btn.danger{background:var(--danger-bg);border-color:var(--danger);color:var(--danger)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{width:auto;padding:8px 12px;font-size:13px}
.link{border:0;background:transparent;color:var(--pine);font-weight:500;padding:6px;text-decoration:underline;text-underline-offset:3px}
a.tel{color:var(--pine);font-weight:700;text-decoration:none}

/* start */
.hero{background:var(--pine);color:var(--pine-ink);border-radius:18px;padding:22px 18px;display:flex;flex-direction:column;gap:8px}
.brand{font-family:"Black Han Sans","IBM Plex Sans KR",sans-serif;font-size:30px;line-height:1.1;letter-spacing:.01em}
.tagline{font-weight:700;font-size:13px;opacity:.95}
.hero p{margin:0;opacity:.9}
.facts{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.facts li{border:1px solid color-mix(in srgb,var(--pine-ink) 40%,transparent);border-radius:999px;padding:3px 10px;font-size:12px}
.auth{display:flex;flex-direction:column;gap:8px}
.social.google{background:var(--panel);}
.social.kakao{background:var(--kakao);color:var(--kakao-ink);border-color:var(--kakao)}
.social.naver{background:var(--naver);color:var(--naver-ink);border-color:var(--naver)}
.soon{font-size:11px;font-weight:500;opacity:.75}
.langsw{display:flex;justify-content:center;gap:4px}
.langsw button{border:0;background:transparent;color:var(--muted);padding:4px 8px}
.langsw button[aria-pressed="true"]{color:var(--ink);font-weight:700;text-decoration:underline;text-underline-offset:4px}
/* 4.8 홈 — 메뉴 사진 (배민에 올린 새 사진과 같은 것) */
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mcard{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.mcard img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block;background:var(--panel2)}
.mcard .mtxt{padding:8px 10px 10px;display:flex;flex-direction:column;gap:2px}
.mcard .mtxt b{font-size:14px;line-height:1.3}
.mcard .mtxt span{font-size:13px;color:var(--muted)}
.hellome{margin:0;text-align:center;font-size:13px;color:var(--muted)}

/* check */
.check{display:flex;gap:8px;align-items:flex-start;font-size:13px}
.check input{margin-top:3px;accent-color:var(--pine);width:16px;height:16px}

/* dates */
.dates{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.date{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:8px 6px;text-align:center;display:flex;flex-direction:column;gap:1px}
.date b{font-size:13px}
.date span{font-size:11px;color:var(--muted)}
.date[aria-pressed="true"]{border-color:var(--pine);background:var(--pine-soft);box-shadow:inset 0 0 0 1px var(--pine)}
.date:disabled{opacity:.5;cursor:not-allowed;background:var(--panel2)}
.date.full span{color:var(--danger)}
.slot{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:10px;font-weight:500}
.slot[aria-pressed="true"]{border-color:var(--pine);background:var(--pine-soft);box-shadow:inset 0 0 0 1px var(--pine)}
.times{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.times .slot{padding:8px 6px;font-variant-numeric:tabular-nums}
.left{margin-left:auto;font-size:11.5px;font-weight:700;color:var(--saffron);background:var(--saffron-bg);border-radius:99px;padding:2px 8px;white-space:nowrap}
.left.ok{color:var(--pine);background:var(--pine-soft)}
.note{border-radius:10px;padding:10px 12px;font-size:13px}
.note.ok{background:var(--pine-soft)}
.note.warn{background:var(--saffron-bg);color:var(--saffron)}
.note.bad{background:var(--danger-bg);color:var(--danger)}
.pc{height:440px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel)}

/* menu */
/* 09-27(8) 사장님 「메뉴 사진 크게 — 한 화면 4개여도 됨」 → 54px → 폰 116px · 넓은 화면 150px */
.item{display:grid;grid-template-columns:116px minmax(0,1fr);gap:12px;align-items:start;padding:12px 0;border-bottom:1px solid var(--line)}
@media (min-width:480px){.item{grid-template-columns:150px minmax(0,1fr)}.thumb{width:150px!important;height:150px!important}}
.item:last-child{border-bottom:0}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.item .ds{font-size:12.5px;line-height:1.45;color:var(--muted);margin-top:3px}
.mcard .mtxt .msub{font-size:12px;line-height:1.4}
.thumb{width:116px;height:116px;border-radius:12px;overflow:hidden;background:repeating-linear-gradient(135deg,var(--pine-soft) 0 6px,var(--panel2) 6px 12px);display:grid;place-items:center;font-size:10px;color:var(--muted);text-align:center}
.item .nm{font-weight:700}
.item .pr{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.step{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin-top:6px}
.step button{border:1px solid var(--line);background:var(--panel2);border-radius:8px;min-width:32px;height:30px;font-weight:700}
.step .q{min-width:36px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
/* 개수 직접 넣기 — ＋/－ 사이 숫자를 손으로 칠 수 있다(09-20 사장님) */
.step .qin{width:52px;height:30px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:inherit;font-size:15px;padding:0 4px}
.step .qin:focus{outline:2px solid var(--pine);outline-offset:1px}
/* 할인 코드 칸 */
.promo{display:flex;gap:6px;align-items:center;margin-top:8px}
.promo input{flex:1;min-width:0;text-transform:uppercase}
.promo .btn{flex:none}
.small.ok{color:var(--pine);font-weight:700}
.small.bad{color:var(--danger);font-weight:700}
.promo .small{flex:1}
.sum{display:flex;flex-direction:column;gap:4px;font-variant-numeric:tabular-nums}
.sum div{display:flex;justify-content:space-between;gap:8px}
.sum .total{font-weight:700;font-size:16px;border-top:1px solid var(--line);padding-top:6px;margin-top:2px}
.bar{height:6px;background:var(--panel2);border:1px solid var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--pine)}
.bar.full i{background:var(--danger)}

/* timeline */
.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.tl li{display:grid;grid-template-columns:22px minmax(0,1fr);gap:10px;padding-bottom:14px;position:relative}
.tl li::before{content:"";position:absolute;left:10px;top:20px;bottom:0;width:2px;background:var(--line)}
.tl li:last-child::before{display:none}
.tl .dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);background:var(--panel);display:grid;place-items:center;font-size:11px;font-weight:700;z-index:1}
.tl li.done .dot{background:var(--pine);border-color:var(--pine);color:var(--pine-ink)}
.tl li.now .dot{border-color:var(--pine);color:var(--pine)}
.tl li.done::before{background:var(--pine)}
.tl b{display:block}
.tl span{font-size:12px;color:var(--muted)}
.acct{font-variant-numeric:tabular-nums;font-size:16px;font-weight:700}

/* owner */
.pill{display:inline-block;border-radius:999px;padding:1px 9px;font-size:11.5px;font-weight:700;white-space:nowrap}
.p-requested{background:var(--saffron-bg);color:var(--saffron)}
.p-accepted{background:var(--panel2);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.p-paid{background:var(--pine-soft);color:var(--pine)}
.p-out{background:var(--pine);color:var(--pine-ink)}
.p-delivered{background:var(--panel2);color:var(--muted)}
.p-rejected{background:var(--danger-bg);color:var(--danger)}
.p-test{background:var(--panel2);color:var(--muted);box-shadow:inset 0 0 0 1px var(--line)}
.ocard{border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:4px;width:100%}
.ocard .top{display:flex;justify-content:space-between;gap:8px;align-items:center}
.ocard .who{font-weight:700}
.ocard .meta{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;flex-shrink:0}
.tabs button{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:5px 11px;font-size:12.5px;white-space:nowrap}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.cap{display:grid;grid-template-columns:62px minmax(0,1fr) 58px;gap:8px;align-items:center;font-size:12px;font-variant-numeric:tabular-nums}
.cap .n{text-align:right;color:var(--muted)}
.receipt{border:2px solid var(--pine);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:2px}
.receipt .big{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.kv{display:grid;grid-template-columns:84px minmax(0,1fr);gap:4px 10px;font-size:13px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;overflow-wrap:anywhere}
.mk{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;font-variant-numeric:tabular-nums}
.mk b{text-align:right}
/* 4.7 후기 별점 */
.stars{display:flex;gap:2px}
.stars button{border:0;background:transparent;font-size:32px;line-height:1;color:var(--line);padding:2px 3px}
.stars button[aria-pressed="true"]{color:var(--saffron)}
.stars.ro{font-size:17px;color:var(--saffron);letter-spacing:1px}
.rvtext{margin:2px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
/* 14단계 호텔 입구 */
.card.hotel{border-color:var(--pine);gap:8px}
.hotelname{font-size:19px;font-weight:800;color:var(--pine)}
.btn.hbtn{flex-direction:column;align-items:flex-start;text-align:left;gap:2px;height:auto;min-height:56px;padding:10px 14px;white-space:normal}
.btn.hbtn b,.btn.hbtn span{display:block;width:100%}
.btn.hbtn b{font-size:16px}
.btn.hbtn span{font-size:12.5px;font-weight:500;opacity:.9;margin-top:2px}
.paybox{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 12px;border:1px dashed var(--pine);border-radius:10px}

<body>
<div role="status" style="padding:10px;text-align:center;background:#fff2cc;color:#493800">데일리할랄 오픈 준비 중 · 현재 주문 접수와 온라인 결제는 진행되지 않습니다.</div>
<div class="phone" id="phone" aria-live="polite">
  <div class="testbar" id="testbar" hidden></div>
  <div class="appbar" id="appbar"></div>
  <div class="screen" id="screen"></div>
  <div class="foot" id="foot"></div>
  <div class="toast" id="toast" role="status"></div>
</div>
<div class="modal" id="modal" role="alertdialog" aria-modal="true" aria-labelledby="modal-msg" hidden><div class="box"><div id="modal-msg"></div><button type="button" class="btn primary" id="modal-ok">확인</button></div></div>

<script>

window.DAILYHALAL_ACCEPTING_ORDERS=false;
document.addEventListener('click',function(e){
 if(window.DAILYHALAL_ACCEPTING_ORDERS)return;
 var b=e.target.closest('[data-act]');if(!b)return;
 var a=b.dataset.act;
 if(['go','code','verify','signup','loginpw','submit','inquiry','oauth','oauthgo','my'].indexOf(a)>=0){
  if(a==='go' && ['login','signup','where'].indexOf(b.dataset.to)<0)return;
  e.preventDefault();e.stopImmediatePropagation();
  alert('정식 주문 접수와 카드결제를 준비하고 있습니다. 현재 결제되거나 주문이 접수되지 않습니다.');
 }
},true);

(function(){
/* 서버(doGet)가 아래 자리에 설정·메뉴·도시·날짜별 남은 수량을 넣어 준다 */
var BOOT='__BOOT__';
/* 4.8 — 홈페이지(dailyhalal.co.kr/order)에 얹은 정적 판은 빌더가 EXEC 를 실제 /exec 주소로 바꿔 넣는다.
   구글 안(GAS)·로컬 미리보기에서는 자리표 그대로 → EXEC='' → 예전처럼 google.script.run 을 쓴다 */
var EXEC="https://script.google.com/macros/s/AKfycbwzZXuo_767PmTXSaEOl7_eeZDzvkzzZruxNrueNg6aOK60m-2MsbI4tuYULoPrnsgk/exec";if(EXEC.indexOf('http')!==0)EXEC='';
var Q={};location.search.replace(/[?&]([^=&]+)=([^&]*)/g,function(m,k,v){Q[k]=decodeURIComponent(v.replace(/\+/g,' '));return m;});

var BRAND,CFG,CAP,CITIES,MENU,TIMES,AVAIL,OFFSET=0,ROLE='customer',KEY='';
var CONTACT={};
/* 14단계 호텔 입구 — QR 주소 ?h=코드. 소셜 로그인에서 돌아오면 ?h 가 사라지므로 이 기기에 3일 남겨 둔다 */
var HOTEL=null,ROOM=null,HCODE='';
(function(){var hs=null;try{hs=JSON.parse(localStorage.getItem('dailyhalal.go.hotel')||'null');}catch(e){}
 if(Q.h){HCODE=String(Q.h).toLowerCase();try{localStorage.setItem('dailyhalal.go.hotel',JSON.stringify({h:HCODE,at:Date.now()}));}catch(e){}}
 else if(hs&&hs.h&&Date.now()-hs.at<3*86400000)HCODE=hs.h;})();
function applyBoot(b){
 window.DAILYHALAL_ACCEPTING_ORDERS=!!(b.site&&b.site.acceptingOrders);
  BRAND=b.brand;CFG=b.st;CAP=CFG.cap;CONTACT=b.contact||{};
  if(b.hotel!==undefined)HOTEL=b.hotel;
  if(b.room)ROOM=b.room;
  CITIES=b.cities.map(function(c){return {id:c.id,ko:c.name_ko,en:c.name_en,area:c.area,minAmount:c.minAmount,min:c.min,fee:c.fee,match:c.match};})
    .concat([{id:'other',ko:'목록에 없는 곳',en:'Somewhere else',out:true}]);
  /* 호텔 방 주문은 가짜 도시 한 줄로 계산한다 — 최소 금액·배달비만 다르다(서버 checkRoomOrder 와 같은 값) */
  if(HOTEL)CITIES.push({id:'__room',ko:HOTEL.name_ko,en:HOTEL.name_en,minAmount:CFG.roomMin,fee:CFG.roomFee,min:0,room:true});
  MENU=b.menu.map(function(m){return {id:m.id,ko:m.name_ko,en:m.name_en,price:m.price,food:m.food,note_ko:m.note_ko,note_en:m.note_en,desc_ko:m.desc_ko||'',desc_en:m.desc_en||''};});
  TIMES={lunch:CFG.lunchTimes,dinner:CFG.dinnerTimes};
  AVAIL=b.avail;OFFSET=b.nowMs-Date.now();
}
function nowMs(){return Date.now()+OFFSET;}

/* 이 기기에만 남기는 것 — 가입 정보·내 주문표·언어·배송지 (시트엔 주문만 간다) */
function lsGet(k,d){try{var v=localStorage.getItem('dailyhalal.go.'+k);return v?JSON.parse(v):d;}catch(e){return d;}}
function lsSet(k,v){try{if(v==null)localStorage.removeItem('dailyhalal.go.'+k);else localStorage.setItem('dailyhalal.go.'+k,JSON.stringify(v));}catch(e){}}

var SLOTS={lunch:{ko:'점심',en:'Lunch'},dinner:{ko:'저녁',en:'Dinner'},now:{ko:'바로 (호텔 방)',en:'ASAP (hotel rooms)'}};
var ST={requested:{ko:'수락 대기',en:'Awaiting approval'},accepted:{ko:'입금 대기',en:'Awaiting payment'},paid:{ko:'확정',en:'Confirmed'},cooking:{ko:'만드는 중',en:'Preparing'},out:{ko:'배달 중',en:'On the way'},delivered:{ko:'배달 완료',en:'Delivered'},
  rejected:{ko:'거절',en:'Declined'},rejected_auto:{ko:'자동 취소',en:'Closed'},expired_unpaid:{ko:'입금 기한 지남',en:'Payment expired'},cancelled:{ko:'취소',en:'Cancelled'}};
var CLOSED=['rejected','rejected_auto','expired_unpaid','cancelled'];
function pillCls(s){return 'p-'+(CLOSED.indexOf(s)>=0?'rejected':s);}

var S;
function emptyQty(){var q={};MENU.forEach(function(m){q[m.id]=0;});return q;}
function fresh(){
  var prof=lsGet('profile',null);
  S={lang:lsGet('lang','ko'),screen:'start',hist:[],user:prof,sess:lsGet('sess',null),vt:'',social:'',codeSent:false,codeAt:0,verified:false,form:{},
     city:'',date:null,slot:'lunch',time:TIMES.lunch[2]||TIMES.lunch[0],qty:emptyQty(),
     addrSel:null,addrOpen:false,spot:'',receipt:'phone',mine:null,myOrders:[],ofilter:'all',oid:null,sday:null,omonth:null,oday:null,
     orders:null,ownerAvail:[],inquiryReason:'',delConfirm:false,promo:null,promoMsg:'',promoBad:false,qraw:{},
     points:null,ptUse:0,ptRaw:null,rvStars:{},reviews:[],hmode:'',roomNo:''};
  try{if(HOTEL)S.hmode=sessionStorage.getItem('hmode')||'';}catch(e){}
}
/* 14단계 — 호텔 입구 안에서 어떤 주문인가: 'room'(방으로 · 오늘 바로) · 'group'(프런트로 · 단체) · ''(보통) */
function isRoom(){return !!(HOTEL&&S.hmode==='room');}
function isHotelOrder(){return !!(HOTEL&&(S.hmode==='room'||S.hmode==='group'));}
function setHmode(k){S.hmode=k;try{if(k)sessionStorage.setItem('hmode',k);else sessionStorage.removeItem('hmode');}catch(e){}}
/* 방 주문 화면 준비 — 오늘·바로·가짜 도시 */
function roomSetup(){S.city='__room';S.date=ROOM?ROOM.date:null;S.slot='now';S.time='';}
function hName(){return HOTEL?T(HOTEL.name_ko,HOTEL.name_en):'';}
/* 주문 상태 이름 — 현장 카드 결제는 수락 = 확정 */
function stL(o){if(o.pay==='card_site'&&o.status==='accepted')return T('확정','Confirmed');return L(ST[o.status]||{ko:o.status,en:o.status});}
/* 주문 한 줄 「어디·언제」 — 방 주문 = 호텔 방 번호 · 오늘 바로 / 호텔 단체 = 호텔 프런트 · 날짜 · 시간 */
function whereLine(o){var hn=o.hotelName?T(o.hotelName,o.hotelNameEn||o.hotelName):'';
 if(o.kind==='room')return esc(hn)+' '+esc(o.roomNo)+T('호','')+' · '+T('오늘 바로','today, ASAP');
 return (hn?esc(hn)+' '+T('프런트','front desk'):esc(T(o.cityName,(city(o.cityId)||{}).en||o.cityName)))+' · '+fd(o.date)+' · '+tlabel(o.slot,o.time);}
function hm(ms){var d=new Date(ms),h=d.getHours(),m=('0'+d.getMinutes()).slice(-2);return T((h<12?'오전 ':'오후 ')+((h%12)||12)+'시'+(m!=='00'?' '+m+'분':''),((h%12)||12)+(m!=='00'?':'+m:'')+(h<12?' AM':' PM'));}

function T(k,e){return S.lang==='ko'?k:e;}
function L(o){return S.lang==='ko'?o.ko:o.en;}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function won(n){return S.lang==='ko'?n.toLocaleString('ko-KR')+'원':'₩'+n.toLocaleString('en-US');}
var WK={ko:['일','월','화','수','목','금','토'],en:['Sun','Mon','Tue','Wed','Thu','Fri','Sat']};
function dObj(ymd){var p=ymd.split('-');return new Date(+p[0],+p[1]-1,+p[2]);}
function fd(ymd){var d=dObj(ymd);return S.lang==='ko'?(d.getMonth()+1)+'/'+d.getDate()+'('+WK.ko[d.getDay()]+')':WK.en[d.getDay()]+' '+(d.getMonth()+1)+'/'+d.getDate();}
function fdt(ms){var d=new Date(ms),h=d.getHours(),m=('0'+d.getMinutes()).slice(-2);
  if(S.lang==='ko'){return (d.getMonth()+1)+'/'+d.getDate()+' '+(h<12?'오전 ':'오후 ')+((h%12)||12)+'시'+(m!=='00'?' '+m+'분':'');}
  return (d.getMonth()+1)+'/'+d.getDate()+' '+((h%12)||12)+(m!=='00'?':'+m:'')+(h<12?' AM':' PM');}
function ago(ms){var m=Math.max(0,Math.round((nowMs()-ms)/60000));
  if(m<1)return T('방금','Just now');if(m<60)return T(m+'분 전',m+' min ago');var h=Math.round(m/60);if(h<24)return T(h+'시간 전',h+' h ago');var d=Math.round(h/24);return T(d+'일 전',d+' days ago');}
function tlabel(sl,t){if(sl==='now')return T('바로 (호텔 방)','ASAP (hotel room)');return (sl==='lunch'?T('점심','Lunch'):T('저녁','Dinner'))+(t?' '+t:'');}
/* 09-27 사장님: 「예시」 표시·시험판 띠 삭제 */
function EX(){return '';}
function city(id){for(var i=0;i<CITIES.length;i++)if(CITIES[i].id===id)return CITIES[i];return null;}
function avail(ymd){for(var i=0;i<AVAIL.length;i++)if(AVAIL[i].date===ymd)return AVAIL[i];return null;}
function iname(l){return S.lang==='ko'?l.ko:l.en;}
function hourLabel(){var h=CFG.deadlineHour;return T((h<12?'오전 ':'오후 ')+((h%12)||12)+'시',((h%12)||12)+(h<12?' AM':' PM'));}
/* 첫 화면 할인 한 줄 — 09-20 사장님 확정: 조건 없이 5%, 마지막 날은 시트(discount_until)에서 */
function untilLabel(){var p=String(CFG.discountUntil||'').split('-');if(p.length!==3)return '';return ' <span class="small muted">('+T((+p[1])+'월 '+(+p[2])+'일까지','until '+(+p[1])+'/'+(+p[2]))+')</span>';}
function saleLine(){
  var pct=Math.round(CFG.discountRate*100),p=String(CFG.discountUntil||'').split('-');
  if(!onSaleNow())return '';
  var ko=CFG.discountMin>1?CFG.discountMin+'인분 이상 '+pct+'% 할인':'모든 주문 '+pct+'% 할인';
  var en=CFG.discountMin>1?pct+'% off from '+CFG.discountMin+' meals':pct+'% off every order';
  if(p.length===3){ko+=' · '+(+p[1])+'월 '+(+p[2])+'일까지';en+=' until '+(+p[1])+'/'+(+p[2]);}
  return T(ko,en);}

/* 금액 미리보기 — 서버 rules.gs 의 quote·applyCode 와 같은 식. 최종 금액은 서버가 다시 계산한다 */
function ymdNow(){var d=new Date(nowMs()+9*3600000);function p(n){return (n<10?'0':'')+n;}
  return d.getUTCFullYear()+'-'+p(d.getUTCMonth()+1)+'-'+p(d.getUTCDate());}
function onSaleNow(){return !CFG.discountUntil||ymdNow()<=CFG.discountUntil;}
function calc(items,cityId){
  var food=0,sub=0,foodSub=0,drinkQ=0;
  MENU.forEach(function(m){var q=items[m.id]||0;if(m.food){food+=q;foodSub+=q*(m.price||0);}else drinkQ+=q;if(m.price)sub+=q*m.price;});
  var c=city(cityId);
  /* 호텔 방 주문(가짜 도시 room)은 단체 할인 없음 — 09-28 사장님 「방 주문은 빼기」(서버 quote 의 noDisc 와 같음) */
  var sale=!(c&&c.room)&&food>=CFG.discountMin&&onSaleNow();
  var disc=sale?Math.round(foodSub*CFG.discountRate/10)*10:0;
  var fee=c&&!c.out&&food>0?c.fee:0;
  /* goods = 코드를 빼기 전 금액. ⛔ 최소 주문 금액은 이 값으로 본다 — 코드로는 못 넘긴다 */
  var goods=sub-disc,cut=0,feeOff=0,p=S.promo;
  if(p&&food>0&&goods>=(p.minAmount||0)){
    if(p.kind==='fee_free')feeOff=fee;
    else if(p.kind==='amount')cut=Math.min(Math.max(0,p.value),goods);
    else if(p.kind==='percent')cut=Math.min(Math.round(goods*(p.value>1?p.value/100:p.value)/10)*10,goods);
  }
  /* 4.7 포인트 — 코드까지 뺀 메뉴 금액까지만(배달비엔 못 씀). ⛔ 최소 주문 금액은 goods(포인트 빼기 전)로 본다 */
  var pmax=Math.max(0,goods-cut),pts=S.points&&food>0?Math.min(S.ptUse||0,S.points.balance,pmax):0;
  return {food:food,sub:sub,disc:disc,sale:sale,fee:fee-feeOff,goods:goods,cut:cut,feeOff:feeOff,pts:pts,pmax:pmax,total:goods-cut-pts+fee-feeOff,drinkQ:drinkQ};
}
/* 그날 남은 인분 — 방 주문은 오늘(부팅의 ROOM.left) */
function dayLeft(){if(isRoom())return ROOM?ROOM.left:0;var a=avail(S.date);return a?a.left:0;}
function roomClosedMsg(){if(!ROOM)return '';if(ROOM.why==='closed_day')return T('오늘은 쉬는 날이라 방 주문을 받지 않습니다. 죄송합니다.','We are closed today, so room orders are not available. Sorry!');
  return T('방 주문은 '+CFG.roomOpen+'~'+CFG.roomClose+'에 받습니다. 그 시간에 다시 주문해 주세요.','Room orders are taken '+CFG.roomOpen+'–'+CFG.roomClose+'. Please order then.');}
function block(){
  var c=city(S.city);
  if(isRoom()){
    if(!ROOM||!ROOM.open)return {kind:'closed',msg:roomClosedMsg()};
    var kr=calc(S.qty,S.city);
    if(kr.food===0)return {kind:'need',msg:T('메뉴 수량을 골라 주세요.','Add some meals.')};
    if(kr.food>ROOM.left)return {kind:'cap',msg:T('오늘은 '+ROOM.left+'인분까지만 받을 수 있습니다.','Only '+ROOM.left+' meals left today.')};
    if(kr.goods<c.minAmount)return {kind:'need',msg:T('방 주문은 '+won(c.minAmount)+'부터 받습니다. '+won(c.minAmount-kr.goods)+' 더 담아 주세요.','Room orders start at '+won(c.minAmount)+'. Add '+won(c.minAmount-kr.goods)+' more.')};
    return null;
  }
  if(!c)return {kind:'need',msg:T('배달 지역을 선택해 주세요.','Choose a delivery area.')};
  if(c.out)return {kind:'inq',code:'out_of_area',msg:T('아직 정기 배달 지역이 아닙니다. 문의를 남기시면 따로 견적을 드립니다.','We don\'t deliver there yet. Leave an inquiry and we\'ll send a quote.')};
  if(S.date===null)return {kind:'need',msg:T('배달 날짜를 골라 주세요.','Choose a delivery date.')};
  var k=calc(S.qty,S.city);
  if(k.food===0)return {kind:'need',msg:T('메뉴 수량을 골라 주세요.','Add some meals.')};
  var a=avail(S.date),left=a?a.left:0;
  if(k.food>left)return {kind:'cap',msg:T('이 날은 '+left+'인분까지만 받을 수 있습니다. 수량을 줄이거나 다른 날짜를 골라 주세요.','Only '+left+' meals left on this day. Reduce the quantity or pick another date.')};
  if(k.goods<c.minAmount)return {kind:'inq',code:'below_min',msg:T(L(c)+'의 최소 주문 금액은 '+won(c.minAmount)+'입니다(배달비 제외). 지금 '+won(k.goods)+' — '+won(c.minAmount-k.goods)+' 더 담거나 문의를 남겨 주세요.','The minimum order for '+L(c)+' is '+won(c.minAmount)+' (delivery fee not included). You have '+won(k.goods)+' — add '+won(c.minAmount-k.goods)+' more or send an inquiry.')};
  return null;
}

/* 서버 부르기 — 정적 판(EXEC 있음)은 fetch 로 /exec 창구(doPost)를 부르고,
   구글 안·미리보기는 예전처럼 google.script.run. 본문을 글자 그대로 보내야(text/plain) 사전 확인 없이 통과한다 */
function api(fn,arg){
  if(EXEC)return fetch(EXEC,{method:'POST',redirect:'follow',body:JSON.stringify({fn:fn,arg:arg})})
    .then(function(r){if(!r.ok)throw new Error('http '+r.status);return r.json();});
  return new Promise(function(res,rej){try{google.script.run.withSuccessHandler(res).withFailureHandler(rej)[fn](arg);}catch(e){rej(e);}});
}
function call(fn,arg,msg){
  var ph=document.getElementById('phone');ph.classList.add('busy');if(msg)toast(msg,20000);
  return api(fn,arg).then(function(r){ph.classList.remove('busy');hideToast();return r;},function(e){ph.classList.remove('busy');
    toast(T('연결이 잠깐 끊겼습니다. 다시 눌러 주세요.','Connection problem. Please try again.'),4000);throw e;});
}
function tokens(){return lsGet('orders',[]).map(function(x){return x.token;});}
function mineArg(){return {tokens:tokens(),sess:S.sess,test:!!BOOT.test};}
/* 로그인 끝 — 표와 가입 정보를 이 기기에 넣는다 */
function setLogin(sess,user){S.sess=sess;lsSet('sess',sess);S.user={name:user.name,group:user.group,phone:user.phone,mkt:!!user.mkt,consent:true,provider:user.provider};lsSet('profile',S.user);}

/* ── 화면들 ── */
var SCR={};
/* 4.8 홈 — 사장님 확정: 메뉴 사진 + 주문하기 + 내 주문 + 로그인/로그아웃 (09-26) */
var IMGB='img/';
/* 09-27(8) 사장님: 케밥·라이스보울·스낵팩 = 비프·치킨·믹스, 캔 4가지로 나눔 — 사진은 메뉴마다 한 장(build_site.py ORDER_PHOTOS) */
var PHOTO={lunchbox:1,kebab_beef:1,kebab_chicken:1,kebab_mix:1,ricebowl_beef:1,ricebowl_chicken:1,ricebowl_mix:1,snack_beef:1,snack_chicken:1,snack_mix:1,
 drink_pepsi:1,drink_pepsi_zero_lime:1,drink_sprite:1,drink_cider_zero:1,fries:1,cheesefries:1};
/* 홈 카드는 묶음으로 — [앞글자, 이름, 영어, 밑줄 설명, 사진] (앞글자_ 로 시작하는 메뉴를 한 카드에) */
var HOMEG=[['lunchbox'],['kebab','케밥','Kebab wraps','비프 · 치킨 · 믹스','Beef · Chicken · Mixed','kebab_beef'],

function promoBox(){
  if(S.promo)return '<div class="promo"><span class="small ok">✓ '+T('코드 '+esc(S.promo.code)+' 적용됨','Code '+esc(S.promo.code)+' applied')+'</span>'+
    '<button type="button" class="btn sm" data-act="promoclear">'+T('빼기','Remove')+'</button></div>';
  return '<div class="promo"><input class="input" id="f-promo" placeholder="'+T('할인 코드가 있으면 넣어 주세요','Discount code (optional)')+'" autocapitalize="characters" autocomplete="off" value="'+esc(S.form['f-promo']||'')+'">'+
    '<button type="button" class="btn sm primary" data-act="promo">'+T('적용','Apply')+'</button></div>'+
    (S.promoMsg?'<div class="small '+(S.promoBad?'bad':'ok')+'">'+esc(S.promoMsg)+'</div>':'');
}
/* 4.7 포인트 — 날짜 글자·남은 포인트 한 줄·쓰기 칸 */
function fdY(ymd){var p=String(ymd).split('-');return p.length<3?'':T((+p[0])+'년 '+(+p[1])+'월 '+(+p[2])+'일',(+p[1])+'/'+(+p[2])+'/'+p[0]);}
function ptWon(n){return (n||0).toLocaleString(S.lang==='ko'?'ko-KR':'en-US')+'P';}
function ptExpLine(p){return p&&p.nextExp?'<div class="small muted">'+T(ptWon(p.nextAmt)+'는 '+fdY(p.nextExp)+'까지 쓰실 수 있어요.',ptWon(p.nextAmt)+' can be used until '+fdY(p.nextExp)+'.')+'</div>':'';}
function pointsBox(k){
  var p=S.points;if(!p||!p.balance)return '';
  var v=S.ptRaw!=null?S.ptRaw:(S.ptUse?String(S.ptUse):'');
  var over=S.ptUse>k.pts?'<div class="small bad">'+T('이번 주문엔 '+ptWon(k.pts)+'까지만 쓸 수 있어요(메뉴 금액까지, 배달비 제외).','Up to '+ptWon(k.pts)+' on this order (menu amount only, not the delivery fee).')+'</div>':'';
  return '<div class="promo"><span class="small" style="flex:none">'+T('포인트','Points')+' <b>'+ptWon(p.balance)+'</b></span>'+
    '<input class="input" id="f-pts" data-pts="1" type="text" inputmode="numeric" autocomplete="off" value="'+esc(v)+'" placeholder="'+T('쓸 포인트','Points to use')+'" aria-label="'+T('이번 주문에 쓸 포인트','Points to use on this order')+'">'+
    '<button type="button" class="btn sm" data-act="ptsall">'+T('전부','All')+'</button></div>'+over+ptExpLine(p);
}

   ['accepted',T('주문 확정','Confirmed'),rm?T('바로 만들기 시작합니다.','We start cooking right away.'):T('약속한 날에 맞춰 준비합니다.','We prepare it for your date.')],

  ['cooking',T('만드는 중','Preparing'),T('주방에서 준비를 시작했습니다.','Your food is being prepared.')],
  ['out',T('출발','On the way'),T('배달 직원이 출발하면 여기 표시됩니다.','Shown here when the driver leaves.')],

 var order=['requested','accepted','paid','cooking','out','delivered'],cur=order.indexOf(o.status);

/* ── 달력 — 예약이 어느 날에 몇 건 있는지 한눈에. 날짜를 누르면 그날 주문만 아래에 뜬다. ── */
function ymd(d){return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);}
function monthKey(d){return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2);}
function calMonth(){
 // 처음 열 때는 「앞으로 올 예약 중 가장 이른 것」이 있는 달을 보여 준다.
 // (배달일은 보통 2~14일 뒤라 월말에는 다음 달이다 — 이번 달만 보여 주면 예약이 없는 것처럼 보인다)
 if(!S.omonth){
  var t=ymd(new Date(nowMs())),soon=null;
  (S.orders||[]).forEach(function(o){ if(CLOSED.indexOf(o.status)<0&&o.date>=t&&(!soon||o.date<soon))soon=o.date; });
  S.omonth=soon?soon.slice(0,7):monthKey(new Date(nowMs()));
 }
 var p=S.omonth.split('-');return {y:+p[0],m:+p[1]};
}
/** 달력 한 벌을 사장님·직원이 같이 쓴다.
 *  act   = 날짜를 눌렀을 때 보낼 이름('oday' 사장님 · 'sday' 직원)
 *  sel   = 지금 고른 날짜
 *  showAll = 「전체 보기」 단추를 둘지(직원은 날짜별로만 보므로 안 둔다) */
function calendarBox(act, sel, showAll){
 act=act||'oday'; sel=sel===undefined?S.oday:sel;
 var mm=calMonth(),first=new Date(mm.y,mm.m-1,1),days=new Date(mm.y,mm.m,0).getDate(),lead=first.getDay();
 var today=ymd(new Date(nowMs()));
 var byDay={};(S.orders||[]).forEach(function(o){(byDay[o.date]=byDay[o.date]||[]).push(o);});
 var avail={};(S.ownerAvail||[]).forEach(function(a){avail[a.date]=a;});
 var cells='';
 for(var i=0;i<lead;i++)cells+='<div class="d pad"></div>';
 for(var day=1;day<=days;day++){
  var key=mm.y+'-'+('0'+mm.m).slice(-2)+'-'+('0'+day).slice(-2);
  var list=(byDay[key]||[]).filter(function(o){return CLOSED.indexOf(o.status)<0;});
  var av=avail[key],food=0;
  list.forEach(function(o){food+=o.food||0;});
  var dots=list.slice(0,6).map(function(o){return '<i class="dot2 '+(o.status==='requested'?'requested':'')+'"></i>';}).join('');
  var cls='d'+(new Date(mm.y,mm.m-1,day).getDay()===0?' sun':'')+(key===today?' today':'')+(sel===key?' on':'')+(av&&av.holiday?' off':'');
  var q=list.length?'<span class="q">'+list.length+T('건','')+'</span><span class="c">'+food+T('인분',' meals')+'</span>':'';
  var capline=av&&av.holiday?'<span class="c">'+T('휴무','off')+'</span>':(av&&list.length&&food>=av.cap?'<span class="c warn">'+T('꽉 참','full')+'</span>':'');
  cells+='<button type="button" class="'+cls+'" data-act="'+act+'" data-d="'+key+'"><span class="n">'+day+'</span>'+q+capline+'<span class="dots">'+dots+'</span></button>';
 }
 var label=S.lang==='ko'?mm.y+'년 '+mm.m+'월':new Date(mm.y,mm.m-1,1).toLocaleString('en-US',{month:'long',year:'numeric'});
 var wk=(S.lang==='ko'?['일','월','화','수','목','금','토']:['S','M','T','W','T','F','S']).map(function(w){return '<span>'+w+'</span>';}).join('');
 return '<div class="card cal"><div class="head"><button type="button" class="nav" data-act="omonth" data-v="-1" aria-label="'+T('이전 달','Previous month')+'">‹</button><b>'+label+'</b>'+
  (showAll&&sel?'<button type="button" class="chipbtn" data-act="'+act+'" data-d="">'+T('전체 보기','Show all')+'</button>':'')+
  '<button type="button" class="nav" data-act="omonth" data-v="1" aria-label="'+T('다음 달','Next month')+'">›</button></div>'+
  '<div class="wk">'+wk+'</div><div class="grid">'+cells+'</div>'+
  '<div class="legend"><span><i style="background:var(--saffron)"></i>'+T('수락 대기','Awaiting')+'</span><span><i style="background:var(--pine)"></i>'+T('진행 중·확정','Active')+'</span><span>'+T('날짜를 누르면 그날 예약만 보입니다.','Tap a day to filter.')+'</span></div></div>';
}

SCR.s_today=function(){
 if(S.orders===null)return loading(T('직원 — 배달일별 할 일','Staff — by delivery day'));
 var days={};S.orders.forEach(function(o){(days[o.date]=days[o.date]||[]).push(o);});
 var keys=Object.keys(days).sort();
 // 처음 열면 가장 이른 배달일. 달력에서 배달 없는 날을 눌러도 그날을 그대로 보여 준다(엉뚱한 날로 튀지 않게)
 if(S.sday===null)S.sday=keys.length?keys[0]:null;
 var cal=calendarBox('sday',S.sday,false);
 if(S.sday===null)return {title:T('직원 — 배달일별 할 일','Staff — by delivery day'),back:false,right:'reload',body:calendarBox('sday',null,false)+'<p class="muted">'+T('확정된 주문이 없습니다.','No confirmed orders.')+'</p>',foot:''};
 var list=days[S.sday]||[],make='';
 ['now','lunch','dinner'].forEach(function(s){var tot={},nm={};list.filter(function(o){return o.slot===s;}).forEach(function(o){o.items.forEach(function(l){tot[l.id]=(tot[l.id]||0)+l.qty;nm[l.id]=l;});});
   var ks=Object.keys(tot);

 var dl=list.map(function(o){var btn=o.status==='paid'||(o.status==='accepted'&&o.pay==='card_site')?'<button type="button" class="btn sm" data-act="set" data-id="'+esc(o.id)+'" data-to="cooking">'+T('만드는 중','Preparing')+'</button>':o.status==='cooking'?'<button type="button" class="btn sm primary" data-act="set" data-id="'+esc(o.id)+'" data-to="out">'+T('출발','Leaving now')+'</button>':o.status==='out'?'<button type="button" class="btn sm primary" data-act="set" data-id="'+esc(o.id)+'" data-to="delivered">'+T('배달 완료','Delivered')+'</button>':'<span class="pill p-delivered">'+L(ST.delivered)+'</span>';
   return '<div class="ocard"><div class="top"><span class="who">'+esc(who(o))+(o.isTest?' <span class="pill p-test">'+T('시험','test')+'</span>':'')+'</span><span class="pill '+pillCls(o.status)+'">'+stL(o)+'</span></div><div class="meta">'+tlabel(o.slot,o.time)+' · '+esc(o.addr)+(o.spot?' · '+esc(o.spot):'')+'</div><div class="meta">'+(o.phone?'<a class="tel" href="tel:'+esc(o.phone)+'">'+esc(o.phone)+'</a>':'')+(o.request?' · '+esc(o.request):'')+'</div>'+(o.pay==='card_site'?'<div class="meta"><b>💳 '+T('받을 때 카드 결제 ','Collect by card ')+won(o.total)+'</b></div>':'')+'<div class="row" style="justify-content:flex-end">'+btn+'</div></div>';}).join('');
 return {title:T('직원 — 배달일별 할 일','Staff — by delivery day'),back:false,right:'reload',body:cal+

/* 다시 그리기 — 글자를 치던 칸은 자리(커서 위치까지) 그대로 돌려놓는다. 개수를 직접 칠 때 필요(09-20) */
function rerender(){
 var sc=document.getElementById('screen'),y=sc.scrollTop;
 var ae=document.activeElement,fid=ae&&ae.id?ae.id:'',pos=null;
 try{if(fid&&ae.selectionStart!=null)pos=[ae.selectionStart,ae.selectionEnd];}catch(x){}
 render();sc.scrollTop=y;
 if(!fid)return;
 var el=document.getElementById(fid);
 if(!el||typeof el.focus!=='function')return;
 REFOCUS=true;el.focus();REFOCUS=false;
 try{if(pos)el.setSelectionRange(pos[0],pos[1]);}catch(x){}
}
/* 다시 그리느라 내가 도로 맞춘 자리인가 — 그때는 글자를 통째로 잡지 않는다 */
var REFOCUS=false;
document.addEventListener('focusin',function(e){
 var t=e.target;
 if(REFOCUS||!t.dataset||!(t.dataset.qty||t.dataset.pts))return;
 // 개수 칸을 누르면 들어 있던 숫자를 통째로 잡는다 — 「0」 옆에 쳐서 260 이 되는 일을 막는다.
 // 누를 때는 focusin 뒤에 커서가 다시 잡히므로 한 박자 뒤에 잡는다.
 setTimeout(function(){if(document.activeElement===t){try{t.select();}catch(x){}}},0);
});
function go(to){S.hist.push(S.screen);S.screen=to;render();}
function home(to){
 /* 14단계 — 호텔 방 주문은 날짜·시간 고르기 없이 바로 메뉴로(로그인·가입이 끝나면 여기로 온다) */
 if(ROLE==='customer'&&to==='where'&&isRoom()){roomSetup();S.hist=['start'];S.screen='menu';render();return;}
 if(ROLE==='customer'&&to==='where'&&HOTEL&&S.hmode==='group'){S.city=HOTEL.cityId;if(S.slot==='now'){S.slot='lunch';S.time=TIMES.lunch[2]||TIMES.lunch[0];}}
 S.hist=(ROLE==='customer'&&to==='where')?['start']:[];S.screen=to;render();}  /* 09-27 사장님 「배달 일정에서 전 화면으로」 — 로그인·가입 뒤에도 첫 화면으로 돌아갈 수 있게 */
/* 09-27(9) 사장님 「돌려보내라」 — 다른 길로 가입한 번호면 창으로 그 길을 알리고 로그인 화면으로(소셜로 막 들어온 표는 버린다) */
function sendBack(e,out){if(out){S.sess=null;lsSet('sess',null);S.user=null;lsSet('profile',null);}S.social='';S.verified=false;S.codeSent=false;S.vt='';clearPw();home('start');notice(T(e.ko,e.en));}
function notice(m){var d=document.getElementById('modal'),b=document.getElementById('modal-ok');document.getElementById('modal-msg').textContent=m;b.textContent=T('확인','OK');d.hidden=false;b.onclick=function(){d.hidden=true;};setTimeout(function(){b.focus();},50);}
var tt;function toast(m,ms){var t=document.getElementById('toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(hideToast,ms||2600);}
function hideToast(){document.getElementById('toast').classList.remove('on');}
function val(id){var e=document.getElementById(id);return e?e.value.trim():'';}

/* 서버에서 새로 받아 오기 */
function loadMine(openLatest){
 var tk=tokens();if(!tk.length&&!S.sess){S.myOrders=[];return Promise.resolve();}
 return api('apiMyOrders',mineArg()).then(function(r){if(!r||!r.ok)return;applyBoot(r.boot);S.myOrders=r.orders;S.points=r.points||null;
   if(S.mine){var m=r.orders.filter(function(o){return o.id===S.mine.id;})[0];if(m)S.mine=m;}
   if(openLatest){var a=r.orders.filter(function(o){return ['requested','accepted','paid','out'].indexOf(o.status)>=0;})[0];if(a&&(S.screen==='where'||S.screen==='start')&&!S.date){S.mine=a;home('status');return;}}
   if(['status','my','where','menu'].indexOf(S.screen)>=0)rerender();});
}

     if(r.order){S.orders=S.orders.map(function(x){return x.id===r.order.id?r.order:x;});}
     var sm={sent:T(' 손님께 문자를 보냈습니다.',' The customer was texted.'),dry:T(' (시험 모드 — 손님 문자는 안 나감)',' (Test mode — no text sent)'),fail:T(' ⚠️ 손님 문자가 실패했습니다 — 직접 연락해 주세요.',' ⚠️ The text failed — please contact the customer.')}[r.sms]||'';
     if(r.ok)toast({accepted:(r.order&&r.order.pay==='card_site'?T('확정했습니다. 직원 화면에 올라갔습니다(받을 때 카드 결제).','Confirmed. It now shows on the staff screen (card on delivery).'):T('수락했습니다. 손님 주문 화면에 입금 계좌가 떴습니다.','Approved. Bank details now show on the customer\'s page.'))+sm,
       cooking:T('만드는 중으로 표시했습니다.','Marked as preparing.')+sm,
       rejected:T('거절했습니다. 손님 주문 화면에 사과 안내가 떴습니다.','Declined. The customer\'s page shows an apology.')+sm,
       paid:T('확정했습니다. 직원 화면에 올라갔습니다.','Confirmed. It now shows on the staff screen.')+sm,
       out:T('출발로 표시했습니다.','Marked as on the way.')+sm,delivered:T('배달 완료로 표시했습니다.','Marked as delivered.')}[to2],4000);
     rerender();});return;}
});
document.addEventListener('change',function(e){
 var t=e.target;
 if(t.dataset&&t.dataset.qty){delete S.qraw[t.dataset.qty];rerender();return;}
 if(t.dataset&&t.dataset.pts){S.ptRaw=null;rerender();return;}
 if(t.dataset&&t.dataset.change==='city'){S.city=t.value;rerender();return;}
 if(t.type==='checkbox'&&t.id){S.form[t.id]=t.checked;return;}
 if(t.name==='rc'){S.receipt=t.value;rerender();}
});
document.addEventListener('input',function(e){
 var t=e.target;if(!t.id||t.type==='checkbox'||t.type==='radio'||t.tagName==='SELECT')return;
 // 개수 직접 넣기 — 친 글자는 그대로 두고(지우는 중일 수 있다) 숫자만 뽑아 수량에 넣는다
 if(t.dataset&&t.dataset.qty){var id=t.dataset.qty,n=parseInt(String(t.value).replace(/[^0-9]/g,''),10);
   S.qraw[id]=t.value;S.qty[id]=isNaN(n)?0:Math.max(0,Math.min(2000,n));rerender();return;}
 if(t.dataset&&t.dataset.pts){var pn=parseInt(String(t.value).replace(/[^0-9]/g,''),10);S.ptRaw=t.value;S.ptUse=isNaN(pn)?0:pn;rerender();return;}
 S.form[t.id]=t.value;
});
setInterval(function(){var el=document.getElementById('otp-timer');if(!el||!S)return;var r=Math.max(0,300-Math.floor((Date.now()-S.codeAt)/1000));
 el.textContent=r>0?T('남은 시간 ','Time left ')+Math.floor(r/60)+':'+('0'+r%60).slice(-2):T('시간이 지났습니다. 다시 받아 주세요.','Code expired. Please resend.');},1000);

/* ── 시작 — BOOT 가 준비된 뒤에 돈다 ── */
function startApp(){
 ROLE=BOOT.role||'customer';KEY=BOOT.key||'';
 applyBoot(BOOT);
 fresh();
 /* 소셜 로그인에서 돌아옴 — 번호가 없으면 번호 인증부터 */
 var AU=BOOT.auth;
 if(ROLE==='customer'&&AU){
  if(AU.sess){S.sess=AU.sess;lsSet('sess',AU.sess);
    if(AU.user.needPhone){S.social=AU.provider;S.form['f-name']=AU.user.name||'';S.screen='signup';S.hist=['start'];}
    else{setLogin(AU.sess,AU.user);var gw=null;try{gw=sessionStorage.getItem('dailyhalal.go');sessionStorage.removeItem('go');}catch(e){}if(gw==='where'){S.screen='where';S.hist=['start'];
      /* 14단계 — 호텔 입구에서 로그인하러 나갔다 온 길 */
      if(isRoom()){roomSetup();S.screen='menu';}else if(HOTEL&&S.hmode==='group')S.city=HOTEL.cityId;}}}
  else if(AU.err==='member_exists')setTimeout(function(){notice(T(AU.msg.ko,AU.msg.en));},300);
  else if(AU.err!=='state')setTimeout(function(){toast(AU.err==='cancel'?T('로그인을 취소하셨습니다.','Sign-in was cancelled.'):T('로그인하지 못했습니다. 잠시 뒤 다시 해 주세요.','Sign-in failed. Please try again.'),4500);},300);
 }
 /* 이 기기의 로그인 표가 아직 살아 있나(지웠거나 기한이 지났으면 가입 정보를 비운다) */
 if(ROLE==='customer'&&S.sess&&!(AU&&AU.sess)){api('apiMe',S.sess).then(function(r){if(r&&!r.ok){S.sess=null;lsSet('sess',null);S.user=null;rerender();}else if(r&&r.ok&&!r.user.needPhone){setLogin(S.sess,r.user);rerender();}});}
 /* 첫 화면 — 4.8 부터 홈(메뉴 사진·주문하기·내 주문·로그인/로그아웃)에서 시작. 진행 중 주문이 있으면 loadMine 이 상태 화면으로 데려간다 */
 if(S.screen==='signup'){}
 else if(BOOT.badKey){S.screen='badkey';}
 else if(ROLE!=='customer'){S.screen=HOME[ROLE];loadStaff();}
 else loadMine(true);
 render();
}
/* 09-27(10) 사장님 「계속 떠 있다」「설정을 불러오지 못했습니다」 — 서버 기록은 전부 완료인데 폰에서 못 받음 → 다시 시도 단추 + 원인 한 줄(다시 시도는 ?code 없이 — 소셜 code 는 한 번만 쓸 수 있다) */
function bootFail(e){var en=/^en/i.test(navigator.language||''),why=e&&e.message?String(e.message).slice(0,80).replace(/</g,'&lt;'):'';
 document.getElementById('screen').innerHTML='<div style="padding:56px 20px;text-align:center"><p style="margin-bottom:16px">'+(en?'Could not load. Please check your connection and try again.':'불러오지 못했습니다. 인터넷 연결을 확인하시고 다시 시도해 주세요.')+'</p>'+
  '<button type="button" class="btn primary" onclick="location.href=location.pathname+(Q.t===\'1\'?\'?t=1\':\'\')">'+(en?'Try again':'다시 시도')+'</button>'+(why?'<p class="muted small" style="margin-top:14px">('+why+')</p>':'')+'</div>';}
/* 설정 받기 — 30초 넘거나 실패하면 두 번 더(1.5초 쉬고). 창구 첫 응답이 6~17초라 한 번 끊겨도 다시 받으면 된다 */
function bootGet(n){var ctl=window.AbortController?new AbortController():null,tm=ctl?setTimeout(function(){ctl.abort();},30000):0;
 return fetch(EXEC+'?api=boot'+(Q.t==='1'?'&t=1':'')+(Q.r?'&r='+encodeURIComponent(Q.r)+'&k='+encodeURIComponent(Q.k||''):'')+(HCODE&&!Q.r?'&h='+encodeURIComponent(HCODE):''),ctl?{signal:ctl.signal}:{})
  .then(function(r){clearTimeout(tm);if(!r.ok)throw new Error('http '+r.status);return r.json();})
  .catch(function(e){clearTimeout(tm);if(n>1)return new Promise(function(res){setTimeout(res,1500);}).then(function(){return bootGet(n-1);});throw e;});}
if(typeof BOOT!=='string')startApp();
else if(!EXEC)bootFail();
else{
 /* 정적 판(dailyhalal.co.kr/order) — 설정을 창구에서 받아 온다. 소셜 로그인에서 ?state&code 로 돌아왔으면 마무리도 서버에 부탁한다 */
 /* 창구 첫 응답이 6~17초(09-27 실측) — 그동안 빈 화면이면 고장으로 보인다 */
 var enL=/^en/i.test(navigator.language||'');
 document.getElementById('screen').innerHTML='<div style="padding:72px 20px;text-align:center"><div style="font-size:22px;font-weight:800;margin-bottom:14px">'+(enL?'Daily Halal Catering':'데일리할랄 단체주문')+'</div><div class="bootspin" style="width:28px;height:28px;margin:0 auto 14px;border:3px solid #d6e2dc;border-top-color:#0f5a46;border-radius:50%;animation:bootspin 1s linear infinite"></div><p class="muted">'+(enL?'Loading… this can take up to 15 seconds.':'불러오는 중입니다… 처음엔 10초쯤 걸릴 수 있어요.')+'</p></div><style>@keyframes bootspin{to{transform:rotate(360deg)}}</style>';
 var pAuth=(Q.state&&(Q.code||Q.error!=null))?api('oauth_finish',{state:Q.state,code:Q.code,error:Q.error}).catch(function(){return {err:'net'};}):Promise.resolve(null);
 Promise.all([bootGet(3),pAuth])
 .then(function(rr){
   BOOT=rr[0];if(rr[1])BOOT.auth=rr[1];
   if(Q.state)try{history.replaceState(null,'',location.pathname+(Q.t==='1'?'?t=1':''));}catch(x){}
   /* 화면 그리다 오류가 나면 도는 화면에 멈추지 말고 알린다 */
   try{startApp();}catch(e){bootFail(e);}
 },bootFail);
}
})();
</script>
</body>
</html>
